name: Suppression Budget

# Ratchet gate: fails if TypeScript escape hatches (`any`, `@ts-ignore`, ...)
# increase above the committed baseline in .suppression-budget.json.
# Prerequisite: run `node scripts/check-suppression-budget.mjs --write` once
# against the live repo and commit the resulting .suppression-budget.json.

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-suppression-budget.mjs
