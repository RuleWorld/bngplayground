name: Dead Code Pruner
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jules-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            You are a dead-code / dependency pruner for the BNG Playground
            monorepo. Standing objective: continuously shrink the surface area.
            This never completes — each run, remove ONE orphaned export or
            unused dependency, then verify nothing broke.

            1. Find a genuinely unused export, file, or npm dependency
               (e.g. via ts-prune / depcheck reasoning, or by tracing imports).
            2. Remove it.
            3. Validate with `npm run type-check`, `npm run lint`, and
               `npm run test:full:safe` (test:full:safe is the hang-safe full suite via scripts/run_full_tests.mjs — never disable the harness).
            4. Open a PR for the single removal.

            CRITICAL — do NOT delete these known-unwired MCP handlers; they are
            intentionally pending wiring, not dead code:
            analyzeResiduals, assessModelMaturity, checkHysteresis,
            checkPhaseHandoff, computeFim, diagnose, exportOmex, exportSbml,
            exportSedml, suggestAnnotations, suggestFix.

            pick a below-threshold target, varied from recent runs (rotate files/areas so successive runs don't re-search the same spot).
            Never edit a metric, threshold, benchmark, or test in the same PR that claims to satisfy it.
            In the PR body, state the assumptions and either/or decisions you made that you would otherwise have asked about.
            Always open a PR. If you found a fix, PR it. If you found nothing, PR a short artifact (the ranked list of what you considered and why each was skipped) so the dead end is on record. Never rename variables or reword comments just to produce a diff.

            Rules:
            - If unsure whether something is truly dead, skip it. False
              positives that delete live code are worse than doing nothing.
            - Never import browser APIs into packages/engine.
            Never ask questions — make your best autonomous judgment; open a PR with your best shot.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
