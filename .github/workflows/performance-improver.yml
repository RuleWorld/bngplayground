name: Performance Improver (multistart)

# Multistart fan-out: one independent "start" per subsystem. All starts share ONE
# yardstick — the existing benchmark harness at tests/profile-everything.spec.ts,
# which already times parse/networkgen/SSA, captures the engine's deterministic
# PROFILE_DATA op-counts, generates a combinatorial netgen stressor, and writes
# a machine-readable JSON. Each start opens its own PR; you keep the best and
# close the rest. Human-reviewed => weekdays only.
#
# Pure-JS only in CI: we set PROFILE_SIM=ssa and PROFILE_ODE_COMPARE=0 so CVODE
# never loads. WASM paths (CVODE/NFsim/Nauty/worker boundary) are out of scope
# ("B", deferred) and are not fan-out seeds.

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    concurrency:
      group: jules-perf-${{ github.workflow }}-${{ matrix.subsystem }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - subsystem: networkgen
            files: >-
              packages/engine/src/services/graph/NetworkGenerator.ts,
              packages/engine/src/services/graph/core/Matcher.ts,
              packages/engine/src/services/simulation/NetworkExpansion.ts
            # Big combinatorial expansion so genMs + breakdown.calls are meaningful.
            profile_env: "PROFILE_MULTISITE=7,9 PROFILE_SIM=ssa PROFILE_ODE_COMPARE=0 PROFILE_REPEATS=5"
            metric: >-
              PRIMARY (deterministic): the breakdown.<section>.calls counts
              (canonicalize, findAllMaps, matchComponents, applyTransformation,
              isDuplicateReaction, degeneracy, speciesDedup). A lower call count
              with species/reactions unchanged is a win, NO replication needed.
              FALLBACK: genMs must improve across two runs.
          - subsystem: ssa
            files: >-
              packages/engine/src/services/simulation/SimulationLoop.ts and the
              SSA solver path it calls
            profile_env: "PROFILE_MULTISITE=7 PROFILE_SIM=ssa PROFILE_ODE_COMPARE=0 PROFILE_REPEATS=5"
            metric: >-
              simMs.ssa (median over repeats). No deterministic op-count exposed
              for SSA, so REPLICATED wall-clock only: the improvement must hold
              across two independent runs.
          - subsystem: parse
            files: >-
              packages/engine/src/parser/ (BNGLParserWrapper.ts and hand-written
              parser internals ONLY — never packages/engine/src/parser/generated/)
            profile_env: "PROFILE_MULTISITE=5 PROFILE_SIM=ssa PROFILE_ODE_COMPARE=0 PROFILE_REPEATS=5"
            metric: >-
              parseMs (median over repeats). No deterministic op-count exposed for
              the parser, so REPLICATED wall-clock only. Parse time is small and
              noisy; be conservative about calling a win.
    steps:
      # Pinned to SHA of v1.0.0. Dependabot (github-actions ecosystem, already
      # configured) maintains the pin via CI-gated bump PRs; review the diff
      # before merging for this autonomous repo-write action.
      - uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566
        with:
          prompt: |
            You are ONE start in a multistart performance fan-out for the BNG
            Playground engine. You own exactly one subsystem: ${{ matrix.subsystem }}.
            Do not modify any other subsystem. Other starts run in parallel on the
            others; a human keeps the best result and closes the rest. Make the
            strongest single attempt on your subsystem; do not coordinate.

            YOUR EDITABLE SCOPE (touch nothing else):
            ${{ matrix.files }}

            YARDSTICK — the shared benchmark is the EXISTING harness
            tests/profile-everything.spec.ts. Do not write a new benchmark. It
            already times parse/networkgen/SSA, captures the engine's
            deterministic PROFILE_DATA op-counts (enableProfiling/PROFILE_DATA in
            NetworkGenerator), builds a 2^N combinatorial stressor, and writes a
            JSON report.             Run it hang-safe via its dedicated config (it is excluded from the
            shared vitest configs so it doesn't slow down normal test gates):

              ${{ matrix.profile_env }} PROFILE_OUT=artifacts/perf/${{ matrix.subsystem }}-baseline.md \
                node scripts/run_full_tests.mjs --config vitest.profile.config.ts

            That writes artifacts/perf/${{ matrix.subsystem }}-baseline.json (an
            array of { model, parseMs, genMs, simMs, species, reactions,
            heapDeltaMB, breakdown:{section:{ms,calls}} }).

            STEPS:
            1. Baseline on the current branch (command above).
            2. Make ONE focused optimization within your editable scope. Profile
               first (node --cpu-prof) — no guessing.
            3. Re-measure to artifacts/perf/${{ matrix.subsystem }}-candidate.json
               (same command, PROFILE_OUT=...-candidate.md).

            DECIDING A WIN for ${{ matrix.subsystem }}:
            ${{ matrix.metric }}

            CORRECTNESS (non-negotiable):
            - species and reactions in the JSON MUST be identical baseline vs
              candidate. If they change, you changed behavior — revert.
            - Run the full scientific suite and it must pass:
                npm run test:full:safe
              Never run raw `npm run test:full` (it hangs). Never disable the
              scripts/run_full_tests.mjs harness.

            LOCKED — never edit in a PR that claims a win:
            tests/profile-everything.spec.ts, anything under perf/models/, any
            threshold, or any test file. Do not tune the ruler.

            ALWAYS OPEN A PR — never manufacture a diff:
            - Win: PR the optimization. In the body, paste the before/after for
              your metric (the breakdown.calls numbers for networkgen, or the two
              wall-clock batches for parse/ssa) and confirm species/reactions
              unchanged.
            - No win: PR the two JSON reports plus your profile under
              artifacts/perf/, so the flat gradient is on record. Do NOT rename
              variables or reword comments to force a diff.
            - State any assumptions or either/or decisions you made in the body.

            Never import browser APIs into packages/engine. Never ask questions —
            make your best autonomous judgment and open the PR.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
