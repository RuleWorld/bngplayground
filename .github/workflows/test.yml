name: CI Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full test suite (includes parity/integration tests)'
        required: false
        type: boolean
        default: false


# The reference sweep regenerates BioNetGen references for the whole RuleHub
# corpus and takes ~40 minutes. A burst of pushes would otherwise queue one
# full sweep per commit, so superseded sweeps are cancelled — but never on main,
# where the sweep is the signal we actually want completed. A Dependabot merge
# landing mid-sweep must not silently cancel it.
#
# Deliberately NO cancel-in-progress: an expression here was still cancelling
# pushes to main, so a 40-minute reference sweep could be killed mid-run and
# report a reduced set of completed checks.
#
# The group is scoped per job. With a single `ci-tests-${{ github.ref }}` group
# a run queues behind whatever is still running in ANY job, so one long
# reference sweep held every later push's run at `pending` with zero jobs
# created — the commit looked green because its checks had not been scheduled at
# all. Scoping by job means a new push's `fast-tests` starts immediately, while
# `reference-tests` still queues behind the previous commit's `reference-tests`
# and so never overlaps or cancels another sweep.
concurrency:
  group: ci-tests-${{ github.ref }}

permissions:
  contents: read

jobs:
  # Fast unit tests - always runs
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout RuleHub
        uses: actions/checkout@v7
        with:
          repository: ruleworld/rulehub
          path: RuleHub
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run fast test suite
        run: npm run test:fast
        env:
          NODE_ENV: test
          RULEHUB_ROOT: ${{ github.workspace }}/RuleHub
      
      - name: Upload coverage (if generated)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fast
          path: coverage/
          if-no-files-found: ignore
  
  # Build verification
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout RuleHub
        uses: actions/checkout@v7
        with:
          repository: ruleworld/rulehub
          path: RuleHub
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Type check
        run: npm run type-check
      
      - name: Build (quick)
        run: npm run build:quick
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory exists"
          ls -lah dist/ | head -20


  cvode-wasm-sanitizer:
    name: CVODE WASM sanitizer and solver tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout SUNDIALS v7.4.0
        uses: actions/checkout@v7
        with:
          repository: LLNL/sundials
          ref: v7.4.0
          path: wasm-sundials/sundials


      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run native bytecode verifier under ASan and UBSan
        run: |
          ./packages/engine/tests/native/generate_native_harness.sh
          ./packages/engine/tests/native/verify_bytecode_native

      - name: Build sanitizer-enabled CVODE WASM
        working-directory: wasm-sundials
        run: bash ./build_wasm.sh
        env:
          CVODE_SANITIZERS: '1'

      - name: Run CVODE solver tests
        run: node scripts/run_full_tests.mjs --config vitest.config.ts packages/engine/tests/CVODESolver*.spec.ts
  # Tool initialization safety check - verifies ODE, SSA, and NFsim runtimes
  # all load without import or initialization errors in a real browser context.
  tool-init-safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright chromium
        # Invoke the CLI shipped by the installed `playwright` package rather than
        # `npx playwright`, which resolves a hoisted bin that can belong to a
        # different version (e.g. via @playwright/test) and then installs browser
        # builds the app's `import { chromium } from 'playwright'` cannot launch.
        run: node node_modules/playwright/cli.js install chromium --with-deps

      - name: Run tool initialization safety check
        run: npm run test:tool-init
  
  # Full test suite - runs on main, manual trigger, or when workflow file changes
  full-tests:
    name: full-tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[full-tests]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout RuleHub
        uses: actions/checkout@v7
        with:
          repository: ruleworld/rulehub
          path: RuleHub

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # BioNetGen comes from akutuva21/bionetgen at a pinned commit, not from
      # `pip install bionetgen`. Two reasons, both measured:
      #
      #  1. The packaged release expands `egfr` to 4301 reactions and
      #     `tlr3_dsrna_sensing` to 161, where upstream master gives 3749 and
      #     158; the surplus entries are duplicates.
      #  2. The cause is in `Perl2/RxnList.pm`: `add()` folded two reactions only
      #     when their RateLaw objects were the SAME OBJECT (`$rxn->RateLaw ==
      #     $rxn2->RateLaw`), so two rules producing an identical reaction each
      #     kept their own entry. The fork merges on
      #     `RateLaw::equivalent(...)` instead, which is what `RateLaw.pm` exists
      #     for, and the duplicates fold away with their stat factors summed.
      #
      # So the reference is the fork, pinned: it is upstream master plus that
      # identity fix, and it is the engine this project is measured against.
      - name: Install BioNetGen from akutuva21/bionetgen (pinned commit)
        env:
          BNG_REPO: https://github.com/akutuva21/bionetgen
          # "fix: fold byte-identical reactions across rules in RxnList::add".
          # bng2/VERSION still reads 2.9.3 here — it is a forked source tree, not
          # a release, so the VERSION file is not a useful pin. This SHA is the
          # commit the reference corpus was generated from. Bump deliberately,
          # then regenerate references.
          BNG_COMMIT: 3513bca766a35de82b883c147174734d316858ba
          # Prebuilt linux-x86_64 run_network, taken from this wheel (see below).
          BNG_WHEEL_VERSION: 0.8.7
          BNG_WHEEL_SHA256: 95c6ff9cf2349dd20280dcd2388a723df72f2283783d0d233a780874ba3628a8
        run: |
          set -euo pipefail

          # ---- BioNetGen: akutuva21/bionetgen at a pinned commit ----
          mkdir -p "$RUNNER_TEMP/bng-src"
          cd "$RUNNER_TEMP/bng-src"
          git init -q .
          git remote add origin "$BNG_REPO"
          git fetch -q --depth 1 origin "$BNG_COMMIT"
          git checkout -q --detach FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$BNG_COMMIT" ]; then
            echo "::error::expected BioNetGen $BNG_COMMIT, got $(git rev-parse HEAD)"
            exit 1
          fi
          BNG_ROOT="$RUNNER_TEMP/bng-src/bng2"
          if [ ! -f "$BNG_ROOT/BNG2.pl" ]; then
            echo "::error::BNG2.pl missing at $BNG_ROOT/BNG2.pl"
            exit 1
          fi
          mkdir -p "$BNG_ROOT/bin"

          # ---- run_network for linux-x86_64 ----
          # The clone tracks only bng2/bin/run_network_MSWin32-32bit.exe, so it
          # carries no linux run_network. Every simulate() action needs one
          # (BNGModel.pm findExec -> $BNGPATH/bin/run_network) and without it the
          # model ABORTs before writing its .gdat -- which reads as an engine
          # regression rather than a missing tool, hence the hard check below.
          #
          # Chosen source: the run_network inside the published bionetgen wheel.
          # It is the binary this job already executed for every model before
          # this change, and it is version-matched to the clone: the wheel's
          # VERSION and the clone's bng2/VERSION are both 2.9.3, i.e. the same
          # Network3 C++ build that belongs to this Perl2 source. Compiling the
          # clone's own Network3 instead would build a *different* binary from
          # whatever toolchain the runner has and move the numerics of the
          # stochastic references, so the pinned prebuilt artifact is the
          # reproducible choice. It links only libc, libm, libstdc++ and
          # libgcc_s, all present on ubuntu-latest.
          pip download --no-deps --quiet -d "$RUNNER_TEMP/bng-wheel" "bionetgen==$BNG_WHEEL_VERSION"
          WHEEL=$(ls "$RUNNER_TEMP"/bng-wheel/bionetgen-*.whl)
          echo "$BNG_WHEEL_SHA256  $WHEEL" | sha256sum -c -
          python3 -c 'import sys,zipfile,shutil; z=zipfile.ZipFile(sys.argv[1]); s=z.open("bionetgen/bng-linux/bin/run_network"); d=open(sys.argv[2],"wb"); shutil.copyfileobj(s,d); d.close(); s.close(); z.close()' \
            "$WHEEL" "$BNG_ROOT/bin/run_network"
          chmod +x "$BNG_ROOT/bin/run_network"
          if [ ! -x "$BNG_ROOT/bin/run_network" ]; then
            echo "::error::linux run_network not installed at $BNG_ROOT/bin/run_network"
            exit 1
          fi

          echo "BNGPATH=$BNG_ROOT" >> "$GITHUB_ENV"
          echo "BNG2_PATH=$BNG_ROOT/BNG2.pl" >> "$GITHUB_ENV"
          echo "BNG2_PL=$BNG_ROOT/BNG2.pl" >> "$GITHUB_ENV"
          echo "NFSIM_PATH=$BNG_ROOT/bin/NFsim" >> "$GITHUB_ENV"
          echo "BioNetGen $BNG_COMMIT installed at $BNG_ROOT"
          ls -la "$BNG_ROOT/BNG2.pl" "$BNG_ROOT/bin/run_network"

          # ---- default.geometry.mdl ----
          # master's BNGOutput.pm:127 resolves default.geometry.mdl from the
          # MODEL FILE's directory and dies without it; the packaged release
          # ships no geometry file, so it tolerated the absence. The reference
          # generator plants a copy next to every model it writes
          # (scripts/generation/generate_no_ref_gdat.ts), so all this step owes
          # is to confirm the source exists -- otherwise the three writeMDL()
          # models (fceri_ji_comp, rec_dim, rec_dim_comp) abort before simulate()
          # and silently produce no .gdat.
          GEOM_SRC="$BNG_ROOT/Models2/MCell/default.geometry.mdl"
          if [ ! -f "$GEOM_SRC" ]; then
            echo "::error::default.geometry.mdl missing at $GEOM_SRC -- BNG2 master needs it next to every model"
            exit 1
          fi

      - name: Build NFsim from source (ruleworld/nfsim HEAD)
        run: |
          git clone --depth 1 https://github.com/ruleworld/nfsim.git /tmp/nfsim-src
          cd /tmp/nfsim-src
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          cp /tmp/nfsim-src/build/NFsim "${BNGPATH}/bin/NFsim"
          echo "NFSIM_PATH=${BNGPATH}/bin/NFsim" >> $GITHUB_ENV
          "${BNGPATH}/bin/NFsim" -help >/dev/null || true
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      # Replace the "Run full test suite (sharded)" step in .github/workflows/test.yml
      - name: Run full test suite (sharded)
        run: |
          TRACE_ENV=""
          if [ "${{ matrix.shard }}" = "3" ]; then
            TRACE_ENV="VITEST_TRACE_SHARD=1"
          fi

          # Wrapper spawns vitest, detects idle hang (WASM fork pool issue),
          # kills it, checks output for pass/fail, and exits.
          env $TRACE_ENV node scripts/run_full_tests.mjs \
            --reporter=default \
            --shard=${{ matrix.shard }}/3 \
            --config vitest.full.config.ts
        env:
          NODE_ENV: test
          RULEHUB_ROOT: ${{ github.workspace }}/RuleHub
      
      - name: Upload coverage (if generated)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-full-shard-${{ matrix.shard }}
          path: coverage/
          if-no-files-found: ignore
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-full-shard-${{ matrix.shard }}
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore

  # Reference parity suite (BioNetGen-style curated validation)
  deterministic-parity:
    name: deterministic-parity (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[full-tests]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout RuleHub
        uses: actions/checkout@v7
        with:
          repository: ruleworld/rulehub
          path: RuleHub

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # BioNetGen comes from akutuva21/bionetgen at a pinned commit, not from
      # `pip install bionetgen`. Two reasons, both measured:
      #
      #  1. The packaged release expands `egfr` to 4301 reactions and
      #     `tlr3_dsrna_sensing` to 161, where upstream master gives 3749 and
      #     158; the surplus entries are duplicates.
      #  2. The cause is in `Perl2/RxnList.pm`: `add()` folded two reactions only
      #     when their RateLaw objects were the SAME OBJECT (`$rxn->RateLaw ==
      #     $rxn2->RateLaw`), so two rules producing an identical reaction each
      #     kept their own entry. The fork merges on
      #     `RateLaw::equivalent(...)` instead, which is what `RateLaw.pm` exists
      #     for, and the duplicates fold away with their stat factors summed.
      #
      # So the reference is the fork, pinned: it is upstream master plus that
      # identity fix, and it is the engine this project is measured against.
      - name: Install BioNetGen from akutuva21/bionetgen (pinned commit)
        env:
          BNG_REPO: https://github.com/akutuva21/bionetgen
          # "fix: fold byte-identical reactions across rules in RxnList::add".
          # bng2/VERSION still reads 2.9.3 here — it is a forked source tree, not
          # a release, so the VERSION file is not a useful pin. This SHA is the
          # commit the reference corpus was generated from. Bump deliberately,
          # then regenerate references.
          BNG_COMMIT: 3513bca766a35de82b883c147174734d316858ba
          # Prebuilt linux-x86_64 run_network, taken from this wheel (see below).
          BNG_WHEEL_VERSION: 0.8.7
          BNG_WHEEL_SHA256: 95c6ff9cf2349dd20280dcd2388a723df72f2283783d0d233a780874ba3628a8
        run: |
          set -euo pipefail

          # ---- BioNetGen: akutuva21/bionetgen at a pinned commit ----
          mkdir -p "$RUNNER_TEMP/bng-src"
          cd "$RUNNER_TEMP/bng-src"
          git init -q .
          git remote add origin "$BNG_REPO"
          git fetch -q --depth 1 origin "$BNG_COMMIT"
          git checkout -q --detach FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$BNG_COMMIT" ]; then
            echo "::error::expected BioNetGen $BNG_COMMIT, got $(git rev-parse HEAD)"
            exit 1
