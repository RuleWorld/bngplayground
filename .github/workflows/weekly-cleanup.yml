name: Weekly Cleanup
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            Maintenance pass on the BNG Playground TS/WASM monorepo.
            - Remove dead code and unused exports (check the 44 handler files;
              flag truly-orphaned handlers, do NOT delete the 11 known unwired
              ones: analyzeResiduals, assessModelMaturity, checkHysteresis,
              checkPhaseHandoff, computeFim, diagnose, exportOmex, exportSbml,
              exportSedml, suggestAnnotations, suggestFix).
            - Reduce duplication, improve naming.
            - Never import browser APIs into packages/engine.
            Run `node scripts/run_full_tests.mjs` before opening a PR. Keep diff focused.
            Never ask questions — make your best autonomous judgment; open a PR with your best shot.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
