name: Type Strictness Tightener
on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:
jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            You are a TypeScript strictness agent for this TS/WASM monorepo.
            Standing objective: eliminate type escape hatches. This never
            completes — each run, fix the single worst file.

            1. Find the file with the most `any`, `@ts-ignore`,
               `@ts-expect-error`, `as any`, or non-null `!` assertions
               (search packages/engine and packages/mcp-server).
            2. Replace them with proper types: real interfaces, generics,
               narrowing, type guards. Do NOT silence by widening to `unknown`
               and casting back, and do NOT just move the suppression around.
            3. Validate with `npm run type-check` (tsc --noEmit),
               `npm run lint` (eslint .), and `npm run test:full`.
            4. One file per PR. Note the before/after count of suppressions.

            Rules:
            - Behavior must not change — types only.
            - Never import browser APIs into packages/engine.
            - If a suppression is genuinely unavoidable (WASM glue boundary),
              leave it but add a one-line comment explaining why, and don't
              count it as a win.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
