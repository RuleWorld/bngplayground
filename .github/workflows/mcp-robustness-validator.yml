name: MCP Robustness Validator
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            MCP robustness agent for the BNG Playground monorepo.
            Standing objective: every MCP tool handler must handle edge
            cases gracefully — no crashes, no silent empty returns, and
            informative error messages.

            1. Scan all tool handlers in `packages/mcp-server/`.
            2. For each handler, construct at least 3 edge-case inputs:
               - Malformed input (unparseable JSON, wrong types)
               - Missing optional fields
               - Boundary conditions (empty string, zero, very large numbers)
            3. Run each edge-case through the actual handler.
            4. For each failure (crash, 500, uninformative error, silent empty
               return), fix the handler to return a proper typed error.
            5. Validate with `npm run type-check` and `npm run test:full`.
            6. One handler per PR. List the edge cases tested in the PR body.

            Rules:
            - Do NOT change the tool's public-facing schema (input/output types).
            - Error ToolResults must include what went wrong and what input caused it.
            - Never import browser APIs into packages/engine.
            Never ask questions — make your best autonomous judgment; open a PR with your best shot.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
