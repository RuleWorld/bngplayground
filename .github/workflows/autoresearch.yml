name: Autoresearch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign to run'
        required: true
        type: choice
        options: [auto, mcp, performance]
        default: auto
      generation1_starts:
        description: 'Generation-1 starts (bounded by the daily controller budget)'
        required: false
        type: number
      refinement:
        description: 'Launch one generation-2 refinement for each winning campaign'
        required: true
        type: boolean
        default: true
      dry_run:
        description: 'Select targets and write a manifest without starting Jules sessions'
        required: true
        type: boolean
        default: false
      base_sha:
        description: 'Optional commit SHA to evaluate and prompt against'
        required: false
        type: string
      promotion_mode:
        description: 'Keep winners as artifacts or open a reviewed PR'
        required: true
        type: choice
        options: [artifact, pr]
        default: artifact

concurrency:
  group: bng-autoresearch
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      run_id: ${{ steps.controller.outputs.run_id }}
      run_directory: ${{ steps.controller.outputs.run_directory }}
      base_sha: ${{ steps.controller.outputs.base_sha }}
      winner_exists: ${{ steps.controller.outputs.winner_exists }}
    env:
      AUTORESEARCH_JULES_BASE_BRANCH: main
      AUTORESEARCH_CAMPAIGN: ${{ inputs.campaign || 'auto' }}
      AUTORESEARCH_REFINEMENT: ${{ inputs.refinement }}
      AUTORESEARCH_DRY_RUN: ${{ inputs.dry_run || false }}
      AUTORESEARCH_PROMOTION_MODE: ${{ inputs.promotion_mode || 'artifact' }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deterministic preflight
        run: |
          npm run type-check
          npm run build:quick
          npm run build -w @bngplayground/mcp-server
          npm run test:mcp-inspector

      - name: Launch, evaluate, rank, and checkpoint autoresearch
        id: controller
        env:
          AUTORESEARCH_GENERATION1_STARTS: ${{ inputs.generation1_starts }}
          AUTORESEARCH_BASE_SHA: ${{ inputs.base_sha }}
        run: node --import tsx scripts/autoresearch/controller.ts

      - name: Upload autoresearch artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autoresearch-${{ github.run_id }}
          path: artifacts/autoresearch/
          if-no-files-found: warn
          retention-days: 14

      - name: Add board to job summary
        if: always()
        run: |
          board=$(find artifacts/autoresearch -name board.md -type f -print -quit)
          if [ -n "$board" ]; then
            cat "$board" >> "$GITHUB_STEP_SUMMARY"
          fi

  promote:
    if: >-
      needs.run.result == 'success' &&
      needs.run.outputs.winner_exists == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.promotion_mode == 'pr'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download evaluated board
        uses: actions/download-artifact@v7
        with:
          name: autoresearch-${{ github.run_id }}
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate evaluated board
        id: board
        run: |
          results=$(find artifacts -type f -path "*/${{ needs.run.outputs.run_id }}/results.json" -print -quit)
          test -n "$results"
          echo "run_directory=$(dirname "$results")" >> "$GITHUB_OUTPUT"

      - name: Promote winner-only PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/autoresearch/promote.ts --mode pr --run-directory "${{ steps.board.outputs.run_directory }}"
