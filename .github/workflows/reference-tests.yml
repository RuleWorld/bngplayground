# Reference parity suite (BioNetGen-style curated validation)
#
# Split out of test.yml so that it has its own concurrency group. `concurrency`
# is evaluated once per workflow run, not per job, so a 40-50 minute reference
# sweep inside test.yml held every later push's ENTIRE run at `pending` with zero
# jobs created — a commit looked green because its checks had not been scheduled.
# Here the sweep queues only against other sweeps, and still never cancels one.
name: Reference Parity

# push-to-main and manual dispatch only: the job's own `if:` gates on
# `github.ref == 'refs/heads/main'` or a `[full-tests]` commit message, so a
# pull_request run would be created and then skip every step.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# No cancel-in-progress: a sweep is 40-50 minutes and a kill mid-run reports a
# reduced set of completed checks. Superseded sweeps queue instead.
concurrency:
  group: reference-parity-${{ github.ref }}

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[full-tests]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout RuleHub
        uses: actions/checkout@v7
        with:
          repository: ruleworld/rulehub
          path: RuleHub

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # BioNetGen comes from akutuva21/bionetgen at a pinned commit, not from
      # `pip install bionetgen`. Two reasons, both measured:
      #
      #  1. The packaged release expands `egfr` to 4301 reactions and
      #     `tlr3_dsrna_sensing` to 161, where upstream master gives 3749 and
      #     158; the surplus entries are duplicates.
      #  2. The cause is in `Perl2/RxnList.pm`: `add()` folded two reactions only
      #     when their RateLaw objects were the SAME OBJECT (`$rxn->RateLaw ==
      #     $rxn2->RateLaw`), so two rules producing an identical reaction each
      #     kept their own entry. The fork merges on
      #     `RateLaw::equivalent(...)` instead, which is what `RateLaw.pm` exists
      #     for, and the duplicates fold away with their stat factors summed.
      #
      # So the reference is the fork, pinned: it is upstream master plus that
      # identity fix, and it is the engine this project is measured against.
      - name: Install BioNetGen from akutuva21/bionetgen (pinned commit)
        env:
          BNG_REPO: https://github.com/akutuva21/bionetgen
          # "fix: fold byte-identical reactions across rules in RxnList::add".
          # bng2/VERSION still reads 2.9.3 here — it is a forked source tree, not
          # a release, so the VERSION file is not a useful pin. This SHA is the
          # commit the reference corpus was generated from. Bump deliberately,
          # then regenerate references.
          BNG_COMMIT: 3513bca766a35de82b883c147174734d316858ba
          # Prebuilt linux-x86_64 run_network, taken from this wheel (see below).
          BNG_WHEEL_VERSION: 0.8.7
          BNG_WHEEL_SHA256: 95c6ff9cf2349dd20280dcd2388a723df72f2283783d0d233a780874ba3628a8
        run: |
          set -euo pipefail

          # ---- BioNetGen: akutuva21/bionetgen at a pinned commit ----
          mkdir -p "$RUNNER_TEMP/bng-src"
          cd "$RUNNER_TEMP/bng-src"
          git init -q .
          git remote add origin "$BNG_REPO"
          git fetch -q --depth 1 origin "$BNG_COMMIT"
          git checkout -q --detach FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$BNG_COMMIT" ]; then
            echo "::error::expected BioNetGen $BNG_COMMIT, got $(git rev-parse HEAD)"
            exit 1
          fi
          BNG_ROOT="$RUNNER_TEMP/bng-src/bng2"
          if [ ! -f "$BNG_ROOT/BNG2.pl" ]; then
            echo "::error::BNG2.pl missing at $BNG_ROOT/BNG2.pl"
            exit 1
          fi
          mkdir -p "$BNG_ROOT/bin"

          # ---- run_network for linux-x86_64 ----
          # The clone tracks only bng2/bin/run_network_MSWin32-32bit.exe, so it
          # carries no linux run_network. Every simulate() action needs one
          # (BNGModel.pm findExec -> $BNGPATH/bin/run_network) and without it the
          # model ABORTs before writing its .gdat -- which reads as an engine
          # regression rather than a missing tool, hence the hard check below.
          #
          # Chosen source: the run_network inside the published bionetgen wheel.
          # It is the binary this job already executed for every model before
          # this change, and it is version-matched to the clone: the wheel's
          # VERSION and the clone's bng2/VERSION are both 2.9.3, i.e. the same
          # Network3 C++ build that belongs to this Perl2 source. Compiling the
          # clone's own Network3 instead would build a *different* binary from
          # whatever toolchain the runner has and move the numerics of the
          # stochastic references, so the pinned prebuilt artifact is the
          # reproducible choice. It links only libc, libm, libstdc++ and
          # libgcc_s, all present on ubuntu-latest.
          pip download --no-deps --quiet -d "$RUNNER_TEMP/bng-wheel" "bionetgen==$BNG_WHEEL_VERSION"
          WHEEL=$(ls "$RUNNER_TEMP"/bng-wheel/bionetgen-*.whl)
          echo "$BNG_WHEEL_SHA256  $WHEEL" | sha256sum -c -
          python3 -c 'import sys,zipfile,shutil; z=zipfile.ZipFile(sys.argv[1]); s=z.open("bionetgen/bng-linux/bin/run_network"); d=open(sys.argv[2],"wb"); shutil.copyfileobj(s,d); d.close(); s.close(); z.close()' \
            "$WHEEL" "$BNG_ROOT/bin/run_network"
          chmod +x "$BNG_ROOT/bin/run_network"
          if [ ! -x "$BNG_ROOT/bin/run_network" ]; then
            echo "::error::linux run_network not installed at $BNG_ROOT/bin/run_network"
            exit 1
          fi

          echo "BNGPATH=$BNG_ROOT" >> "$GITHUB_ENV"
          echo "BNG2_PATH=$BNG_ROOT/BNG2.pl" >> "$GITHUB_ENV"
          echo "BNG2_PL=$BNG_ROOT/BNG2.pl" >> "$GITHUB_ENV"
          echo "NFSIM_PATH=$BNG_ROOT/bin/NFsim" >> "$GITHUB_ENV"
          echo "BioNetGen $BNG_COMMIT installed at $BNG_ROOT"
          ls -la "$BNG_ROOT/BNG2.pl" "$BNG_ROOT/bin/run_network"

          # ---- default.geometry.mdl ----
          # master's BNGOutput.pm:127 resolves default.geometry.mdl from the
          # MODEL FILE's directory and dies without it; the packaged release
          # ships no geometry file, so it tolerated the absence. The reference
          # generator plants a copy next to every model it writes
          # (scripts/generation/generate_no_ref_gdat.ts), so all this step owes
          # is to confirm the source exists -- otherwise the three writeMDL()
          # models (fceri_ji_comp, rec_dim, rec_dim_comp) abort before simulate()
          # and silently produce no .gdat.
          GEOM_SRC="$BNG_ROOT/Models2/MCell/default.geometry.mdl"
          if [ ! -f "$GEOM_SRC" ]; then
            echo "::error::default.geometry.mdl missing at $GEOM_SRC -- BNG2 master needs it next to every model"
            exit 1
          fi

      - name: Build NFsim from source (ruleworld/nfsim HEAD)
        run: |
          git clone --depth 1 https://github.com/ruleworld/nfsim.git /tmp/nfsim-src
          cd /tmp/nfsim-src
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          cp /tmp/nfsim-src/build/NFsim "${BNGPATH}/bin/NFsim"
          echo "NFSIM_PATH=${BNGPATH}/bin/NFsim" >> $GITHUB_ENV
          "${BNGPATH}/bin/NFsim" -help >/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        # See tool-init-safety-check: pin the CLI to the installed playwright package.
        run: node node_modules/playwright/cli.js install chromium --with-deps

      - name: Build application
        run: npm run build

      - name: Generate web output via Playwright
        run: npm run generate:web-output
        env:
          NODE_ENV: test
          RULEHUB_ROOT: ${{ github.workspace }}/RuleHub
          WEB_OUTPUT_STRICT: '1'

      - name: Generate BNG2 reference outputs
        run: npm run generate:gdat
        env:
          NODE_ENV: test
          RULEHUB_ROOT: ${{ github.workspace }}/RuleHub
          BNG2_PATH: ${{ env.BNG2_PATH }}
          BNG2_PL: ${{ env.BNG2_PATH }}
          BNGPATH: ${{ env.BNGPATH }}
          NFSIM_PATH: ${{ env.NFSIM_PATH }}

      - name: Run reference validation suite
        run: npm run test:reference
        env:
          BNG_OUTPUT_DIR: bng_test_output
          NODE_ENV: test
          RULEHUB_ROOT: ${{ github.workspace }}/RuleHub
          BNG2_PATH: ${{ env.BNG2_PATH }}
          BNGPATH: ${{ env.BNGPATH }}
          NFSIM_PATH: ${{ env.NFSIM_PATH }}

      - name: Upload reference test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-reference
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore

      # Structural parity: a rule the expander silently drops yields a smaller
      # network whose trajectories can still look plausible, so compare species
      # and reaction counts against the .net files BNG2.pl just produced.
      # Runs *after* the trajectory suite so a structural regression never
      # prevents the primary comparison from producing its report.
      - name: Run network-shape parity against BNG2 networks
        if: always()
        run: npm run test:reference:net-shape
        env:
          BNG_TEST_OUTPUT_DIR: bng_test_output
          NODE_ENV: test

      - name: Upload network-shape report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-shape-report
          path: artifacts/network_shape_report.json
          if-no-files-found: ignore

  # Deterministic ODE parity (direct comparison against BNG2 fixtures using layered parity check)
