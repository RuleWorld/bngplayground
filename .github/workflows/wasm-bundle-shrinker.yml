name: WASM Bundle Shrinker
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            You are a bundle-size agent. The product is browser-native and
            zero-install, so load time is a core claim — smaller WASM/JS is
            directly valuable. Standing objective: shrink the shipped bundle.
            This never completes; each run, find the single largest reducible
            artifact and shrink it.

            1. Measure current sizes of the 7 WASM modules in public/
               (nauty, igraph, libbng, libsbml, nfsim, spatial, cvode) and the
               built JS via `npm run build` output. Record before-bytes.
            2. Pick the largest reducible target. Options: Emscripten flags
               (-Os/-Oz, ASSERTIONS=0, MALLOC=emmalloc, strip), dead-code
               elimination, lazy-loading a module, dynamic import of heavy JS,
               dependency replacement.
            3. Re-measure. Record after-bytes and % change.
            4. Validate functionality with `npm run test:full`
               (uses scripts/run_full_tests.mjs — do not disable it).
            5. Open a PR ONLY on a measurable byte reduction. Put the
               before/after table in the PR description.

            Rules:
            - No behavior or public API changes.
            - Don't sacrifice correctness for size — all tests must pass.
            Never ask questions — make your best autonomous judgment; open a PR with your best shot.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
